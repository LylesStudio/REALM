[package]
name = "realm-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "REALM desktop client (Tauri 2): launches/manages the local REALM service; Android build is client-only."
license = "Apache-2.0"

[lib]
name = "realm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
