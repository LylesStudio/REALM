<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>REALM</title>
<style>
  :root {
    --paper: #f5f1e8;
    --paper-strong: #fbf8f0;
    --ink: #2c2a26;
    --ink-soft: #5b564c;
    --accent: #7a5b2f;
    --danger: #8b2e2e;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    display: flex;
    min-height: 100dvh;
  }
  main {
    margin: auto;
    max-width: 560px;
    padding: 24px;
    width: 100%;
  }
  .eyebrow {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.18em;
    margin: 0 0 4px;
  }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .card {
    background: var(--paper-strong);
    border: 1px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(44, 42, 38, 0.25);
    padding: 16px;
  }
  .status-line { margin: 0 0 12px; }
  .status-line small { color: var(--ink-soft); display: block; margin-top: 4px; word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    padding: 10px 16px;
  }
  button.is-primary { background: var(--ink); color: var(--paper); }
  button:disabled { cursor: not-allowed; opacity: 0.55; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .error-box {
    border: 1px solid var(--danger);
    color: var(--danger);
    margin-top: 12px;
    padding: 10px;
    word-break: break-word;
  }
  label { display: block; margin-top: 12px; }
  input[type="text"], input[type="url"] {
    background: var(--paper-strong);
    border: 1px solid var(--ink);
    font: inherit;
    margin-top: 4px;
    padding: 10px;
    width: 100%;
  }
  .spinner {
    animation: spin 1s linear infinite;
    border: 2px solid var(--ink-soft);
    border-top-color: var(--ink);
    display: inline-block;
    height: 16px;
    margin-right: 8px;
    vertical-align: -3px;
    width: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: var(--ink-soft); font-size: 13px; }
  #logs-panel pre {
    background: var(--paper);
    border: 1px solid var(--ink);
    font-size: 12px;
    margin: 12px 0 0;
    max-height: 240px;
    overflow: auto;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .setting { color: var(--ink-soft); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">REALM · 界核</p>
  <h1 id="title">正在启动</h1>
  <div class="card">
    <p class="status-line" id="status"><span class="spinner" aria-hidden="true"></span>正在准备…</p>
    <div id="error" class="error-box" hidden></div>
    <div id="config" hidden>
      <p class="hint">REALM 客户端只连接你自己运行的服务。请输入服务地址或大厅邀请链接（http/https，不要包含用户名、密码或令牌）。</p>
      <label>服务地址
        <input id="server-url" type="url" inputmode="url" autocomplete="off"
               placeholder="http://192.168.1.20:9999 或粘贴 ?lobby= 邀请链接" />
      </label>
    </div>
    <div class="actions" id="actions"></div>
    <div id="logs-panel" hidden>
      <pre id="logs"></pre>
      <div class="actions" id="logs-actions"></div>
    </div>
    <label class="setting" id="close-setting" hidden>
      <input id="stop-on-close" type="checkbox" checked /> 关闭本页面或控制台窗口时停止 REALM 服务
    </label>
    <div id="lan-config" hidden>
      <label>LAN 绑定地址（可选，具体 IPv4；0.0.0.0 需另填分享地址）
        <input id="lan-bind" type="text" inputmode="decimal" autocomplete="off"
               placeholder="192.168.1.20" />
      </label>
      <label>LAN 分享地址（可选，http(s) origin，不含路径/凭据）
        <input id="advertised-origin" type="url" inputmode="url" autocomplete="off"
               placeholder="http://192.168.1.20:9999" />
      </label>
      <p class="hint">绑定地址会让本地服务监听局域网；仅在你明确知道本机地址时填写。保存后重启服务生效，LAN 模式需要访问令牌。</p>
    </div>
  </div>
  <p class="hint" id="footnote"></p>
</main>
<script>
(() => {
  "use strict";
  const tauri = window.__TAURI__;
  const title = document.getElementById("title");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");
  const actions = document.getElementById("actions");
  const configBox = document.getElementById("config");
  const urlInput = document.getElementById("server-url");
  const footnote = document.getElementById("footnote");
  const STORAGE_KEY = "realm.serverUrl";

  // ---- 传输层：Tauri 走 core.invoke；浏览器控制台模式走本机 console host ----
  const isTauri = Boolean(tauri);
  const httpCall = async (method, path, body) => {
    const response = await fetch(path, {
      method,
      headers: body === undefined ? undefined : { "content-type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    return payload;
  };
  // 控制台模式的 LAN 校验（与 launcher/advertised-origin 同规则：纯
  // http(s) origin，无 userinfo/路径/query/fragment）。
  const validateOriginJs = (input) => {
    const trimmed = String(input ?? "").trim();
    let parsed;
    try { parsed = new URL(trimmed); } catch { throw new Error("invalid url"); }
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      throw new Error("unsupported scheme");
    }
    if (!parsed.hostname) throw new Error("missing host");
    if (parsed.username || parsed.password) {
      throw new Error("credentials in url are not allowed");
    }
    if (parsed.search || parsed.hash || (parsed.pathname !== "/" && parsed.pathname !== "")) {
      throw new Error("advertised origin must not contain a path");
    }
    return parsed.origin;
  };
  const validateLanBindJs = (input) => {
    const bind = String(input ?? "").trim();
    const octets = bind.split(".");
    if (bind !== "0.0.0.0"
        && (octets.length !== 4
          || octets.some((octet) => !/^\d{1,3}$/.test(octet) || Number(octet) > 255))) {
      throw new Error("LAN bind must be an explicit IPv4 address");
    }
    return bind;
  };
  const invoke = isTauri
    ? (name, args) => tauri.core.invoke(name, args)
    : async (name, args) => {
        switch (name) {
          case "host_kind": return "desktop";
          case "service_state": return httpCall("GET", "/api/state");
          case "service_start": return httpCall("POST", "/api/start", args ?? {});
          case "service_stop": return httpCall("POST", "/api/stop");
          case "service_restart": return httpCall("POST", "/api/restart");
          case "open_in_browser":
            return httpCall("POST", "/api/open-browser", { url: args?.url });
          case "service_logs":
            return httpCall("GET", `/api/logs?lines=${encodeURIComponent(args?.lines ?? 200)}`);
          case "console_config": return httpCall("GET", "/api/config");
          case "set_console_config": return httpCall("POST", "/api/config", args ?? {});
          case "validate_advertised_origin": return validateOriginJs(args?.input);
          case "validate_lan_bind": return validateLanBindJs(args?.input);
          default: throw new Error(`unavailable in console mode: ${name}`);
        }
      };
  // 状态推送：Tauri 走 service-state 事件；控制台模式 SSE + 轮询兜底。
  const listenState = async (handler) => {
    if (isTauri) {
      await tauri.event.listen("service-state", (event) => handler(event.payload));
      return;
    }
    handler(await invoke("service_state"));
    setInterval(() => {
      invoke("service_state").then(handler).catch(() => { /* 下次轮询 */ });
    }, 1_000);
    try {
      const source = new EventSource("/api/events");
      source.onmessage = (event) => {
        try { handler(JSON.parse(event.data)); } catch { /* 忽略坏帧 */ }
      };
    } catch { /* EventSource 不可用时轮询兜底 */ }
  };
  const button = (label, onClick, primary) => {
    const element = document.createElement("button");
    element.type = "button";
    element.textContent = label;
    if (primary) element.className = "is-primary";
    element.addEventListener("click", onClick);
    return element;
  };
  // 状态渲染零 innerHTML：文本一律 textContent/TextNode（用户输入与
  // 服务端值不未经转义进 HTML）；spinner/小字用 DOM 节点。
  const render = (heading, statusText, buttons, foot, opts = {}) => {
    title.textContent = heading;
    status.replaceChildren();
    if (opts.spinner) {
      const spin = document.createElement("span");
      spin.className = "spinner";
      spin.setAttribute("aria-hidden", "true");
      status.appendChild(spin);
    }
    status.appendChild(document.createTextNode(statusText));
    if (opts.small) {
      const small = document.createElement("small");
      small.textContent = opts.small;
      status.appendChild(small);
    }
    actions.replaceChildren(...buttons);
    buttons[0]?.focus();
    footnote.textContent = foot || "";
  };
  const showError = (message) => {
    errorBox.hidden = !message;
    errorBox.textContent = message || "";
  };

  const STEP_LABELS = {
    spawn: "正在拉起本地服务…",
    lock: "正在获取实例锁…",
    postgres: "正在启动数据库…",
    provision: "正在准备数据库角色…",
    migrations: "正在应用数据迁移…",
    seed: "正在准备演示世界…",
    server: "正在启动应用服务…",
    health: "正在等待服务就绪…",
    ready: "服务已就绪",
  };

  // ---- 控制台通用能力：重启/日志/关闭即停设置 ----
  // 打开客户端（Tauri 本窗口加载；浏览器控制台模式开新标签页，避免把
  // 控制台本身导航走）——各调用点按 isTauri 分支内联。
  let lastKnownPhase = "idle";
  async function restartService() {
    await invoke("service_stop");
    const deadline = Date.now() + 45_000;
    for (;;) {
      const phase = await invoke("service_state");
      if (phase.phase === "stopped" || phase.phase === "idle" || phase.phase === "failed") break;
      if (Date.now() > deadline) throw new Error("停止超时");
      await new Promise((resolve) => setTimeout(resolve, 300));
    }
    await startService();
  }
  const logsPanel = document.getElementById("logs-panel");
  const logsBox = document.getElementById("logs");
  const logsActions = document.getElementById("logs-actions");
  let logsActionsReady = false;
  async function refreshLogs() {
    try {
      const payload = await invoke("service_logs", { lines: 200 });
      const lines = Array.isArray(payload.lines) ? payload.lines : [];
      logsBox.textContent = lines.length > 0 ? lines.join("\n") : "（暂无日志）";
    } catch (error) {
      logsBox.textContent = `无法读取日志：${error}`;
    }
  }
  function toggleLogs() {
    logsPanel.hidden = !logsPanel.hidden;
    if (!logsPanel.hidden) {
      if (!logsActionsReady) {
        logsActions.appendChild(button("刷新日志", () => void refreshLogs()));
        logsActionsReady = true;
      }
      void refreshLogs();
    }
  }
  const logsButton = () => button("查看日志", () => toggleLogs());
  // 关闭控制台时的服务处置（仅控制台模式可配；Tauri 关窗恒停止，Rust 保证）。
  const closeSetting = document.getElementById("close-setting");
  const stopOnCloseInput = document.getElementById("stop-on-close");
  window.addEventListener("beforeunload", (event) => {
    if (!isTauri && stopOnCloseInput.checked && lastKnownPhase === "ready") {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  let lastUrl = "";

  function renderPhase(phase) {
    if (!phase) return;
    lastKnownPhase = phase.phase;
    if (phase.phase === "idle") {
      render("正在启动", "正在准备…", [], "", { spinner: true });
    } else if (phase.phase === "starting") {
      render("正在启动",
        STEP_LABELS[phase.step] || "正在启动…",
        [
          logsButton(),
          button("停止", async () => { await invoke("service_stop"); }),
        ], "", { spinner: true });
    } else if (phase.phase === "ready") {
      lastUrl = phase.url;
      render("服务已就绪",
        "REALM 本地服务正在运行。", [
          button("打开客户端", () => {
            if (isTauri) window.location.replace(phase.url);
            else window.open(phase.url, "_blank", "noopener");
          }, true),
          button("打开网页", async () => {
            showError("");
            try {
              await invoke("open_in_browser", { url: phase.url });
              render("网页已打开",
                "已在系统浏览器打开。", [
                  button("打开客户端", () => {
                    if (isTauri) window.location.replace(phase.url);
                    else window.open(phase.url, "_blank", "noopener");
                  }),
                  button("停止服务并退出", async () => { await invoke("service_stop"); }),
                ], "关闭本窗口也会停止服务。");
            } catch (error) {
              showError(String(error));
            }
          }),
          button("停止服务并退出", async () => { await invoke("service_stop"); }),
          button("重启服务", async () => {
            showError("");
            try { await restartService(); } catch (error) { showError(String(error)); }
          }),
          logsButton(),
        ], "选择「打开客户端」在本窗口使用 REALM；选择「打开网页」用系统浏览器。", { small: phase.url });
      footnote.textContent = shareOriginNote(phase);
      actions.appendChild(button("LAN 分享设置", () => {
        lanConfig.hidden = !lanConfig.hidden;
        lanBindInput.value = localStorage.getItem(LAN_BIND_KEY) || "";
        originInput.value = localStorage.getItem(ORIGIN_KEY) || "";
        if (!lanConfig.hidden && !lanConfig.querySelector("button")) {
          lanConfig.appendChild(button("保存并重启服务", () => void saveOriginAndRestart(), true));
        }
      }));
    } else if (phase.phase === "failed") {
      const already = phase.kind === "already-running";
      render(already ? "已有实例在运行" : "启动失败",
        already ? "检测到另一个 REALM 实例正在运行。请先关闭它，或稍后再试。" : "本地服务未能启动。", [
          button("重试", async () => {
            showError("");
            try { await startService(); } catch (error) { showError(String(error)); }
          }, true),
          logsButton(),
          button("退出", () => { window.close(); }),
        ]);
      showError(phase.message || "");
    } else if (phase.phase === "stopping") {
      render("正在停止", "正在优雅停止服务…", [], "", { spinner: true });
    } else if (phase.phase === "stopped") {
      render("已停止", "本地服务已停止。", [
        button("重新启动", async () => {
          showError("");
          try { await invoke("service_start"); } catch (error) { showError(String(error)); }
        }, true),
        button("退出", () => { window.close(); }),
      ]);
    }
  }

  async function checkAndConnect(normalized, lobbyRoomId) {
    render("正在检查连接",
      `正在连接 ${normalized} …`, [], "", { spinner: true });
    try {
      // 由 Tauri Rust 侧检查，避免从 tauri://localhost 对服务端发起
      // 跨域 fetch；服务端无需为客户端壳开放 CORS。
      await invoke("check_server", { url: normalized });
      // 只持久化服务根地址——roomId/邀请 query 一次性导航用，绝不落盘。
      localStorage.setItem(STORAGE_KEY, normalized);
      window.location.replace(
        lobbyRoomId
          ? `${normalized}/?lobby=${encodeURIComponent(lobbyRoomId)}`
          : normalized + "/",
      );
    } catch (error) {
      render("连接失败", `无法连接 ${normalized}。`, [
        button("重试", () => void checkAndConnect(normalized, lobbyRoomId), true),
        button("更换服务地址", () => showConfig()),
      ]);
      showError(error instanceof DOMException && error.name === "AbortError"
        ? "连接超时：请确认 REALM 服务已启动，且手机与电脑在同一局域网。"
        : String(error));
    }
  }

  function showConfig() {
    configBox.hidden = false;
    const saved = localStorage.getItem(STORAGE_KEY) || "";
    if (saved) urlInput.value = saved;
    render("连接 REALM 服务",
      "输入你的 REALM 服务地址，或直接粘贴大厅邀请链接。", [
        button("连接", async () => {
          showError("");
          try {
            // 单一入口：服务根地址与邀请 URL 都由 Rust 校验（白名单结构）。
            const target = await invoke("validate_invite_url", { input: urlInput.value });
            await checkAndConnect(target.serverUrl, target.lobbyRoomId ?? null);
          } catch (error) {
            showError("服务地址或邀请链接无效：" + String(error));
          }
        }, true),
      ], "首次使用：在电脑上启动 REALM 桌面端或本地服务，并开启可信局域网模式后，把地址填到这里；也可以直接粘贴房主分享的大厅邀请链接。HTTP 连接未加密，优先使用 HTTPS。");
    urlInput.focus();
  }

  const ORIGIN_KEY = "realm.advertisedOrigin";
  const LAN_BIND_KEY = "realm.lanBind";
  const lanConfig = document.getElementById("lan-config");
  const lanBindInput = document.getElementById("lan-bind");
  const originInput = document.getElementById("advertised-origin");

  async function startService() {
    const savedOrigin = (localStorage.getItem(ORIGIN_KEY) || "").trim();
    const savedBind = (localStorage.getItem(LAN_BIND_KEY) || "").trim();
    const args = {
      ...(savedOrigin ? { advertisedOrigin: savedOrigin } : {}),
      ...(savedBind ? { lanBind: savedBind } : {}),
    };
    await invoke("service_start", args);
  }

  async function saveOriginAndRestart() {
    showError("");
    const rawOrigin = originInput.value.trim();
    const rawBind = lanBindInput.value.trim();
    try {
      if (rawOrigin) await invoke("validate_advertised_origin", { input: rawOrigin });
      if (rawBind) await invoke("validate_lan_bind", { input: rawBind });
      localStorage.setItem(ORIGIN_KEY, rawOrigin);
      localStorage.setItem(LAN_BIND_KEY, rawBind);
      await invoke("service_stop");
      const deadline = Date.now() + 45_000;
      for (;;) {
        const phase = await invoke("service_state");
        if (phase.phase === "stopped" || phase.phase === "idle") break;
        if (Date.now() > deadline) throw new Error("停止超时");
        await new Promise((resolve) => setTimeout(resolve, 300));
      }
      await startService();
    } catch (error) {
      showError("LAN 分享地址无效：" + String(error));
    }
  }

  function shareOriginNote(phase) {
    if (!phase || phase.phase !== "ready") return "";
    return phase.advertised_origin
      ? `LAN 分享地址已配置：${phase.advertised_origin}`
      : "未配置 LAN 分享地址：邀请链接仅本机可用。";
  }

  async function boot() {
    const kind = await invoke("host_kind");
    if (kind === "android") {
      showConfig();
      return;
    }
    await listenState(renderPhase);
    if (!isTauri) {
      // 控制台模式：显示「关闭即停服务」设置（默认开），与 console host 配置同步。
      closeSetting.hidden = false;
      try {
        const config = await invoke("console_config");
        stopOnCloseInput.checked = config.stopOnClose !== false;
      } catch { /* 读取失败时保持默认勾选 */ }
      stopOnCloseInput.addEventListener("change", () => {
        invoke("set_console_config", { stopOnClose: stopOnCloseInput.checked })
          .catch(() => { /* 保持现状 */ });
      });
    }
    renderPhase(await invoke("service_state"));
    try {
      await startService();
    } catch (error) {
      showError(String(error));
    }
  }

  boot().catch((error) => {
    render("启动失败", "客户端引导失败。", [button("重试", () => window.location.reload(), true)]);
    showError(String(error));
  });
})();
</script>
</body>
</html>
