name: CI

on:
  # 公开仓：CI 依赖本地 PostgreSQL 环境，GitHub runner 上不具备；
  # 保持手动触发，由维护者在配置好的环境跑。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test chain
        run: npm test

      - name: Run lint
        run: npm run lint
